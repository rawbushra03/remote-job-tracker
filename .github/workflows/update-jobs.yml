name: Update remote jobs daily

# Keeps data/jobs_sample.csv fresh so the live Streamlit dashboard always
# shows recent listings from all sources without any manual work.

on:
  # Run every day at 06:00 UTC (about 01:00 in Bushra's EST timezone).
  schedule:
    - cron: "0 6 * * *"
  # Allow running it manually from the GitHub "Actions" tab.
  workflow_dispatch:

# The job needs write access to push the refreshed CSV back to the repo.
permissions:
  contents: write

concurrency:
  group: update-jobs
  cancel-in-progress: false

jobs:
  update-jobs:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run multi-source aggregator
        run: python src/aggregate.py --sample --max-jobs 500

      - name: Regenerate analysis charts
        run: python src/analyzer.py
        continue-on-error: true

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage the refreshed data and charts.
          git add data/jobs_sample.csv screenshots/*.png

          # Only commit if something actually changed.
          if git diff --staged --quiet; then
            echo "No changes to commit — data is already up to date."
            exit 0
          fi

          TODAY=$(date -u +"%Y-%m-%d")
          git commit -m "chore(data): auto-update remote jobs (${TODAY}) [skip ci]"
          git push
